<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <title>Three lamingtons on a plate</title>
  <defs>
    <pattern id="coconut" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="2" fill="#fffaf0"/>
      <circle cx="13" cy="3" r="1.5" fill="#fffaf0"/>
      <circle cx="9" cy="12" r="2" fill="#fffaf0"/>
      <circle cx="16" cy="15" r="1.4" fill="#fffaf0"/>
      <circle cx="2" cy="16" r="1.2" fill="#fffaf0"/>
    </pattern>
    <g id="lamington">
      <polygon points="0,0 130,-75 260,0 130,75" fill="#7a4630"/>
      <polygon points="0,0 130,75 130,225 0,150" fill="#4e2a1a"/>
      <polygon points="130,75 260,0 260,150 130,225" fill="#613622"/>
      <polygon points="0,0 130,-75 260,0 130,75" fill="url(#coconut)" opacity="0.85"/>
      <polygon points="0,0 130,75 130,225 0,150" fill="url(#coconut)" opacity="0.6"/>
      <polygon points="130,75 260,0 260,150 130,225" fill="url(#coconut)" opacity="0.7"/>
    </g>
  </defs>

  <rect width="1200" height="500" fill="#fbf6ea"/>

  <!-- eucalyptus sprig -->
  <path d="M40 470 C120 380 160 300 170 200" stroke="#6b8f7d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#8fb3a1">
    <ellipse cx="120" cy="400" rx="30" ry="18" transform="rotate(-30 120 400)"/>
    <ellipse cx="170" cy="330" rx="28" ry="17" transform="rotate(20 170 330)"/>
    <ellipse cx="135" cy="290" rx="26" ry="16" transform="rotate(-40 135 290)"/>
    <ellipse cx="180" cy="230" rx="24" ry="15" transform="rotate(10 180 230)"/>
  </g>

  <!-- plate -->
  <ellipse cx="620" cy="400" rx="420" ry="80" fill="#8a5d38" opacity="0.18"/>
  <ellipse cx="620" cy="390" rx="410" ry="78" fill="#ffffff" stroke="#e8dcc6" stroke-width="4"/>

  <!-- three lamingtons -->
  <use href="#lamington" x="300" y="170"/>
  <use href="#lamington" x="640" y="170"/>
  <use href="#lamington" x="470" y="230"/>
</svg>
