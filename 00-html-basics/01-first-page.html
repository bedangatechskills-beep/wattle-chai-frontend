<!DOCTYPE html>
<!-- Line 1 tells the browser: "this is a modern HTML page" (HTML5, the latest version). Always the first line. -->

<!-- This grey text is a COMMENT. The browser does not show it. We use comments to leave notes for people. -->

<!-- <html> wraps the whole page. lang="en" says the page is in English (screen readers and Google use this). -->
<html lang="en">

<!-- <head> holds information ABOUT the page. Nothing in here shows on the page itself. -->
<head>
  <!-- charset="UTF-8" lets the page show every letter and symbol: é in café, emojis like ☕ -->
  <meta charset="UTF-8">

  <!-- viewport makes the page fit a phone screen instead of looking tiny -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- <title> is the text on the browser tab (and in Google results) -->
  <!-- &amp; is how we write the & symbol in HTML, because & has a special job in HTML. -->
  <title>Wattle &amp; Chai · My first page</title>
</head>

<!-- <body> holds EVERYTHING you can see on the page -->
<body>

  <!-- <h1> is the main heading. Use ONE h1 per page: it says what the whole page is about. -->
  <h1>Wattle &amp; Chai</h1>

  <!-- <p> is a paragraph of text -->
  <p>A small café in Melbourne. Flat whites, momos and good company.</p>

  <!-- Every tag we opened, we close: </body> then </html>. Like closing a lunchbox. -->
</body>
</html>
